<div class="d-flex justify-content-center align-items-center vh-100">
    <div class="card p-4 shadow-lg" style="width: 400px;">
        <h3 class="text-center mb-4">Connexion</h3>
        <app-alert [message]="alertMessage" [type]="alertType"></app-alert>
        <form [formGroup]="signInForm" (ngSubmit)="onSubmit()">
            
            <div class="form-group">
                <label for="email">Adresse e-mail</label>
                <input type="email" class="form-control" id="email" formControlName="email">
                <div *ngIf="signInForm.get('email')?.invalid && signInForm.get('email')?.touched" class="text-danger">
                    <small *ngIf="signInForm.get('email')?.errors?.['required']">L'e-mail est obligatoire.</small>
                    <small *ngIf="signInForm.get('email')?.errors?.['email']">Format d'e-mail invalide.</small>
                </div>
            </div>
            
            <div class="form-group">
                <label for="password">Mot de passe</label>
                <div class="input-group">
                    <input 
                        [type]="showPassword ? 'text' : 'password'" 
                        id="password" 
                        class="form-control" 
                        formControlName="password">
                    <div class="input-group-append">
                        <button 
                            type="button" 
                            class="btn btn-secondary" 
                            (click)="togglePasswordVisibility()">
                            <i class="material-icons">{{ showPassword ? 'visibility' : 'visibility_off' }}</i>
                        </button>
                    </div>
                </div>
                <div *ngIf="signInForm.get('password')?.invalid && signInForm.get('password')?.touched" class="text-danger">
                    <small *ngIf="signInForm.get('password')?.errors?.['required']">Le mot de passe est requis.</small>
                </div>
            </div>
            
            <button type="submit" class="btn btn-danger w-100 mt-3" [disabled]="signInForm.invalid">Se connecter</button>
        </form>
        
        <div class="text-center">
            <small>Vous n'avez pas de compte ? <a routerLink="../signup">S'inscrire</a></small>
        </div>
    </div>
</div>
