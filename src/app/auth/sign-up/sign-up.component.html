<div class="main-content">
    <div class="container-fluid">
        <div class="row"><div class="col-md-8">
            <div class="card">
                <div class="card-header card-header-danger">
                    <h4 class="card-title">Sign Up</h4>
                    <p class="card-category">Create your account</p>
                </div>
                <div class="card-body">
                    <form [formGroup]="signUpForm" (ngSubmit)="onSubmit()">
                        <div class="row">
                            <div class="col-md-6">
                            <mat-form-field class="example-full-width">
                                <input matInput placeholder="First Name" formControlName="firstName" required>
                                <mat-error *ngIf="signUpForm.get('firstName')?.hasError('required')">
                                First name is required
                                </mat-error>
                            </mat-form-field>
                            </div>
                            <div class="col-md-6">
                            <mat-form-field class="example-full-width">
                                <input matInput placeholder="Last Name" formControlName="lastName" required>
                                <mat-error *ngIf="signUpForm.get('lastName')?.hasError('required')">
                                Last name is required
                                </mat-error>
                            </mat-form-field>
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-md-12">
                            <mat-form-field class="example-full-width">
                                <input matInput placeholder="Email" formControlName="email" type="email" required>
                                <mat-error *ngIf="signUpForm.get('email')?.hasError('required')">
                                Email is required
                                </mat-error>
                                <mat-error *ngIf="signUpForm.get('email')?.hasError('email')">
                                Invalid email format
                                </mat-error>
                            </mat-form-field>
                            </div>
                        </div>
                    <div class="row">
                        <div class="col-md-6">
                        <mat-form-field class="example-full-width">
                            <input matInput placeholder="Password" formControlName="password" type="password" required>
                            <mat-error *ngIf="signUpForm.get('password')?.hasError('required')">
                            Password is required
                            </mat-error>
                        </mat-form-field>
                        </div>
                        <div class="col-md-6">
                        <mat-form-field class="example-full-width">
                            <input matInput placeholder="Confirm Password" formControlName="confirmPassword" type="password" required>
                            <mat-error *ngIf="signUpForm.get('confirmPassword')?.hasError('required')">
                            Please confirm your password
                            </mat-error>
                        </mat-form-field>
                        </div>
                        </div>
                        <button mat-raised-button type="submit" class="btn btn-danger pull-right">Sign Up</button>
                        <div class="clearfix"></div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
</div>
